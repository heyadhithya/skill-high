[project]
name = "skill-high-api"
version = "0.1.0"
description = "Skill-High marketplace API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "procrastinate[psycopg]>=3.6,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
