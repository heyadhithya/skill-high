services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: skillhigh_dev
      POSTGRES_USER: skillhigh
      POSTGRES_PASSWORD: skillhigh
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - skillhigh_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillhigh -d skillhigh_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  skillhigh_postgres:
